<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EType · 本地验证</title>
<style>
:root{color-scheme:light;--blue:#245fb5;--ink:#182a41;--muted:#6c7a90;--line:#dde5ee}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:960px;margin:48px auto;padding:0 24px}header{display:flex;align-items:center;gap:15px;margin-bottom:28px}header img{width:52px;height:52px;object-fit:contain}h1{font-size:25px;margin:0}h2{font-size:16px;margin:0 0 12px}.sub{color:var(--muted);font-size:13px}.badge{margin-left:auto;color:#237354;background:#e5f3eb;border-radius:30px;padding:5px 13px;font-size:12px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 6px 24px #17365305}textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--ink);font:17px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;outline-color:var(--blue)}textarea[readonly]{min-height:70px;background:#f8faff;font-size:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}button,select{font:inherit;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:8px 14px;cursor:pointer}button:hover{border-color:#91acd5;background:#f3f7fe}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#1c4f9c;color:white}.examples button{font-size:12px;padding:5px 10px;color:var(--muted)}#count{margin-left:auto;color:var(--muted);font-size:12px}.candidates{display:flex;gap:10px;flex-wrap:wrap}.candidate{flex:1;min-width:220px;max-width:100%;text-align:left;padding:14px;border-radius:10px;display:flex;gap:10px}.candidate.selected{background:#eaf1fd;border-color:#a9c1e5}.number{color:var(--blue);font-weight:600}.empty{color:var(--muted);padding:20px 0;font-size:14px}.status{min-height:24px;color:var(--muted);font-size:13px;margin:12px 0 0}.error{color:#b13636}audio{width:100%;height:38px;margin-top:16px}.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:30px}.footer button{font-size:12px;padding:4px 10px}.hint{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:600px){main{margin:24px auto;padding:0 14px}.panel{padding:18px}.badge{display:none}}
</style>
<main>
<header><img src="/logo.png" alt="EType"><div><h1>EType 本地验证</h1><div class="sub">句子候选与自然语音 · 已接入原生开发版，系统安装版尚未更新</div></div><span class="badge">本机运行 · 无 API 费用</span></header>
<section class="panel"><h2>输入英文</h2><textarea id="input" maxlength="500" spellcheck="false" aria-label="英文输入">I went to the bank to deposit some money.</textarea>
<div class="row examples"><button data-text="I went to the bank to deposit some money.">bank · 银行</button><button data-text="We sat on the bank and watched the river.">bank · 河岸</button><button data-text="I didn't say he stole the money.">否定句</button><button data-text="comfortable">单词试听</button><span id="count"></span></div>
<div class="row"><button class="primary" id="translate">生成中文候选</button><span class="sub">Ctrl + Enter</span></div><p id="translationStatus" class="status" role="status"></p></section>
<section class="panel"><h2>中文候选</h2><div id="candidates" class="candidates"><div class="empty">输入完整句子，点击生成中文候选。</div></div><div class="hint">候选经过模型复核，仍可能有误；点击候选查看，确认后可复制。</div><div class="row"><textarea id="output" readonly aria-label="选中的中文"></textarea><button id="copy" disabled>复制中文</button><span id="copyStatus" class="sub" role="status"></span></div></section>
<section class="panel"><h2>英文原文发音</h2><div class="row"><select id="voice" aria-label="美式音色"><option value="female">美式女声 · Heart</option><option value="male">美式男声 · Michael</option></select><select id="speed" aria-label="语速"><option value="1">正常速度</option><option value="0.8">慢速</option></select><button id="speak">播放英文</button><button id="stop">停止播放</button></div><audio id="player" controls preload="none"></audio><p id="speechStatus" class="status" role="status">单词和句子共用音色；重复播放优先读取本地缓存。</p></section>
<div class="footer"><span>本地模型需要占用内存和显存。测试结束后可关闭服务释放资源。</span><button id="shutdown">关闭验证服务</button></div>
</main>
<script>
const input=document.querySelector('#input'), output=document.querySelector('#output'), player=document.querySelector('#player');
let revision=0, playRevision=0;
const status=(id,text,error=false)=>{const e=document.getElementById(id);e.textContent=text;e.classList.toggle('error',error)};
function resetAudio(){player.pause();player.removeAttribute('src');player.load();}
function changed(){revision++;playRevision++;resetAudio();document.getElementById('count').textContent=input.value.length+' / 500';output.value='';document.getElementById('copy').disabled=true;const empty=document.createElement('div');empty.className='empty';empty.textContent='输入完整句子，点击生成中文候选。';document.getElementById('candidates').replaceChildren(empty);status('translationStatus','');status('copyStatus','');status('speechStatus','单词和句子共用音色；重复播放优先读取本地缓存。');}
input.addEventListener('input',changed);changed();
document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>{input.value=b.dataset.text;changed();input.focus()});
async function request(path,data){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-EType-Lab':'1'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'操作失败');return result}
document.getElementById('translate').onclick=async function(){const version=revision;this.disabled=true;status('translationStatus','正在生成并复核中文候选…');try{const r=await request('/translate',{text:input.value});if(version!==revision)return;const area=document.getElementById('candidates');area.replaceChildren();r.candidates.forEach((text,i)=>{const b=document.createElement('button');b.className='candidate';const n=document.createElement('span');n.className='number';n.textContent=i+1;const t=document.createElement('span');t.textContent=text;b.append(n,t);b.onclick=()=>{area.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');output.value=text;document.getElementById('copy').disabled=false;status('copyStatus','')};area.append(b);if(i===0)b.click()});status('translationStatus','已生成 '+r.candidates.length+' 条候选 · '+r.seconds+' 秒')}catch(e){if(version===revision)status('translationStatus',e.message,true)}finally{this.disabled=false}};
input.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();const b=document.getElementById('translate');if(!b.disabled)b.click()}});
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output.value);status('copyStatus','已复制')}catch(e){status('copyStatus','请选中中文后手动复制',true)}};
document.getElementById('speak').onclick=async function(){const version=++playRevision;this.disabled=true;player.pause();status('speechStatus','正在本机生成语音，首次加载需要稍候…');try{const r=await request('/speak',{text:input.value,voice:document.getElementById('voice').value,speed:Number(document.getElementById('speed').value)});if(version!==playRevision)return;player.src=r.audio_url;await player.play();status('speechStatus',(r.cached?'本地缓存':'新生成')+' · '+r.seconds+' 秒 · 音频 '+r.audio_seconds+' 秒')}catch(e){if(version===playRevision)status('speechStatus',e.message,true)}finally{this.disabled=false}};
document.getElementById('stop').onclick=()=>{playRevision++;player.pause();player.currentTime=0;status('speechStatus','已停止播放')};
for(const id of ['voice','speed'])document.getElementById(id).onchange=()=>{playRevision++;resetAudio();status('speechStatus','设置已改变，点击播放英文生成对应语音。')};
document.getElementById('shutdown').onclick=async function(){try{await request('/shutdown',{});playRevision++;player.pause();document.querySelectorAll('button,select,textarea').forEach(e=>e.disabled=true);status('speechStatus','验证服务已关闭，重新运行启动脚本可继续使用。')}catch(e){status('speechStatus',e.message,true)}};
</script>
</html>
