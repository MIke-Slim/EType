<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>EType 在线版开发预览</title>
<style>body{font:16px "Segoe UI","Microsoft YaHei",sans-serif;background:#f3f6f7;color:#16302f;margin:0}main{max-width:760px;margin:48px auto;background:white;padding:32px;border-radius:18px}h1{font-size:24px}textarea{width:100%;box-sizing:border-box;min-height:140px;padding:16px;font:20px inherit;border:1px solid #b8ccc8;border-radius:10px}button,select{padding:10px 16px;margin:8px 8px 8px 0;border:1px solid #b8ccc8;background:white;border-radius:8px;color:#087767;cursor:pointer}.candidate{display:block;text-align:left;width:100%;font-size:20px;background:#e3f3ee}.hint{color:#637572;font-size:14px}#status{min-height:24px}#output{padding:16px;background:#f3f6f7;white-space:pre-wrap;min-height:28px}</style>
<main><h1>EType · 在线轻量版</h1><p class="hint">独立开发预览，旧版输入法继续保留。翻译与朗读需要联网。</p>
<button id="mode">单词模式 · Ctrl+Shift+空格切换</button><textarea id="input" placeholder="完整拼写，例如 bank"></textarea>
<button id="translate">查词</button><button id="speak">朗读原文</button><button id="stop">停止</button><select id="voice"><option value="female">美式女声</option><option value="male">美式男声</option></select><select id="speed"><option value="1">正常速度</option><option value="0.8">慢速</option></select>
<p id="status" class="hint"></p><div id="candidates"></div><p>已确认的输出</p><div id="output"></div><audio id="audio" controls></audio>
<p class="hint">句子：Enter 获取中文，再按 Enter 确认；Ctrl+Enter 输出英文。单词：空格选择中文或获取纠错，Enter 输出英文。免费额度不足时保留英文。</p></main>
<script>
let sentence=false,revision=0,values=[],pending=false,timer;const $=id=>document.getElementById(id);
function clear(){revision++;values=[];$('candidates').replaceChildren();$('status').textContent='';}
function mode(){clear();sentence=!sentence;$('mode').textContent=(sentence?'句子模式':'单词模式')+' · Ctrl+Shift+空格切换';$('translate').textContent=sentence?'翻译句子':'查词';$('input').placeholder=sentence?'输入完整英文句子，再按 Enter':'完整拼写，例如 bank';}
async function request(route,data){const response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-EType-Lab':'1'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'在线服务不可用');return result;}
function choose(index){const value=values[index];if(!value)return;if(value.correction){$('input').value=value.text;clear();lookup();return;}$('output').textContent=value.text;$('input').value='';clear();}
function render(candidates){values=candidates;$('candidates').replaceChildren();candidates.forEach((value,index)=>{let button=document.createElement('button');button.className='candidate';button.textContent=(index+1)+'　'+value.text+(value.pos?'　'+value.pos:'');button.onclick=()=>choose(index);$('candidates').append(button);});}
async function lookup(correct=false){const text=$('input').value.trim();if(!text)return;const token=revision;pending=true;$('status').textContent='正在联网查询…';try{const data=await request(sentence?'/translate':correct?'/correct':'/word',{text});if(token!==revision)return;if(sentence)render(data.candidates.map(text=>({text})));else if(correct)render(data.corrections.map(text=>({text,correction:true})));else render(data.entry?.candidates||[]);$('status').textContent=data.entry?.phonetic||(values.length?'请选择候选':'未找到完整单词，空格获取纠错；英文已保留');}catch(error){if(token===revision)$('status').textContent=error.message;}finally{pending=false;}}
$('mode').onclick=mode;$('translate').onclick=()=>lookup();$('input').oninput=()=>{clear();clearTimeout(timer);if(!sentence&&$('input').value.trim())timer=setTimeout(()=>lookup(),450);};
$('input').onkeydown=event=>{if(event.ctrlKey&&event.shiftKey&&event.code==='Space'){event.preventDefault();mode();return;}if(event.key==='Enter'){event.preventDefault();if(event.ctrlKey||!sentence){$('output').textContent=$('input').value;$('input').value='';clear();}else if(values.length)choose(0);else if(!pending)lookup();}else if(event.code==='Space'&&!sentence){event.preventDefault();if(values.length)choose(0);else lookup(true);}else if(!sentence&&/^[1-5]$/.test(event.key)&&values.length){event.preventDefault();choose(Number(event.key)-1);}};
let speechRevision=0;$('speak').onclick=async()=>{const token=++speechRevision;const text=$('input').value;$('status').textContent='正在准备在线语音…';try{const data=await request('/speak',{text,voice:$('voice').value,speed:Number($('speed').value)});if(token!==speechRevision)return;$('audio').src=data.audio_url;await $('audio').play();$('status').textContent='正在播放 · Edge 在线语音';}catch(error){if(token===speechRevision)$('status').textContent=error.message;}};$('stop').onclick=()=>{speechRevision++;$('audio').pause();$('audio').removeAttribute('src');$('audio').load();$('status').textContent='播放已停止';};
</script></html>
